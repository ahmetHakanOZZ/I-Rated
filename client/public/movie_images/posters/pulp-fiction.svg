    <pattern id="grain" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#fff" opacity=".16"/></pattern>
    <style>.title{font:700 27px Georgia,serif;letter-spacing:1.1px;fill:#fff}.meta{font:600 10px Arial,sans-serif;letter-spacing:4px;fill:#f2c14e}</style>
